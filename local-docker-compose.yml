version: '3.8'

services:
  # 1. Transactional Store (ACID for Account Balances)
  postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - payment-network 

  # 2. Audit Trail Store (Immutable Event Logs & Payload History)
  mongodb:
    image: mongo:8.0-noble
    container_name: payment-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - payment-network

  # 3. Cache & Distributed Lock (Auth Tokens & Concurrency Locks)
  redis:
    image: redis:7-alpine
    container_name: payment-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - payment-network

  # 4. Message Broker (Async Events, Saga Pattern & Retries)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: payment-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"       # AMQP Protocol Port
      - "${RABBITMQ_MGMT_PORT}:15672" # Web Dashboard Port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - payment-network

networks:
  payment-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data: